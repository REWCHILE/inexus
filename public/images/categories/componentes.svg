<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <defs>
        <linearGradient id="grad-chip" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
    </defs>
    <!-- CPU Center Die -->
    <rect x="34" y="34" width="52" height="52" rx="8" stroke="url(#grad-chip)" stroke-width="3.5" fill="#f0f9ff"/>
    <rect x="44" y="44" width="32" height="32" rx="4" stroke="#0284c7" stroke-width="2" fill="#e0f2fe"/>
    <!-- Die Inner Pattern -->
    <circle cx="60" cy="60" r="7" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <circle cx="60" cy="60" r="2.5" fill="#0284c7"/>

    <!-- Top Pins -->
    <line x1="43" y1="20" x2="43" y2="34" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="18" x2="54" y2="34" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="18" x2="66" y2="34" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="20" x2="77" y2="34" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Pins -->
    <line x1="43" y1="86" x2="43" y2="100" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="86" x2="54" y2="102" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="86" x2="66" y2="102" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="86" x2="77" y2="100" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Pins -->
    <line x1="20" y1="43" x2="34" y2="43" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="54" x2="34" y2="54" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="66" x2="34" y2="66" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="77" x2="34" y2="77" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Pins -->
    <line x1="86" y1="43" x2="100" y2="43" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="54" x2="102" y2="54" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="66" x2="102" y2="66" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="77" x2="100" y2="77" stroke="url(#grad-chip)" stroke-width="3" stroke-linecap="round"/>
</svg>
