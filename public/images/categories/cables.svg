<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <defs>
        <linearGradient id="grad-cable" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
    </defs>
    <!-- Curved Cable Cord Loop -->
    <path d="M26 44 C20 75 42 100 66 100 C92 100 102 70 94 48" stroke="url(#grad-cable)" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 50 C32 70 48 90 66 90 C84 90 92 68 86 52" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Left Connector (HDMI/Type-C) -->
    <rect x="18" y="24" width="16" height="22" rx="3" stroke="url(#grad-cable)" stroke-width="3" fill="#f0f9ff"/>
    <rect x="22" y="14" width="8" height="10" rx="1" stroke="#0284c7" stroke-width="2" fill="#38bdf8"/>
    <!-- Connector Collar -->
    <line x1="18" y1="36" x2="34" y2="36" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Right Connector (Ethernet RJ45 / Gold-plated Plug) -->
    <rect x="86" y="26" width="16" height="22" rx="3" stroke="url(#grad-cable)" stroke-width="3" fill="#f0f9ff"/>
    <rect x="90" y="16" width="8" height="10" rx="1" stroke="#0284c7" stroke-width="2" fill="#38bdf8"/>
    <!-- RJ45 Clip -->
    <path d="M94 20 L94 24" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="86" y1="38" x2="102" y2="38" stroke="#0284c7" stroke-width="1.5"/>
</svg>
