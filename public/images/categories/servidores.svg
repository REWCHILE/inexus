<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <defs>
        <linearGradient id="grad-server" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
    </defs>
    <!-- Rack Main Chassis Frame -->
    <rect x="24" y="16" width="72" height="88" rx="6" stroke="url(#grad-server)" stroke-width="3.5" fill="#f0f9ff"/>
    <!-- Server Unit 1 -->
    <rect x="30" y="24" width="60" height="18" rx="3" stroke="#0284c7" stroke-width="2" fill="#e0f2fe"/>
    <circle cx="39" cy="33" r="2.5" fill="#0284c7"/>
    <circle cx="47" cy="33" r="2" fill="#38bdf8"/>
    <line x1="56" y1="33" x2="82" y2="33" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>

    <!-- Server Unit 2 -->
    <rect x="30" y="48" width="60" height="18" rx="3" stroke="#0284c7" stroke-width="2" fill="#e0f2fe"/>
    <circle cx="39" cy="57" r="2.5" fill="#0284c7"/>
    <circle cx="47" cy="57" r="2" fill="#38bdf8"/>
    <line x1="56" y1="57" x2="82" y2="57" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>

    <!-- Server Unit 3 -->
    <rect x="30" y="72" width="60" height="18" rx="3" stroke="#0284c7" stroke-width="2" fill="#e0f2fe"/>
    <circle cx="39" cy="81" r="2.5" fill="#0284c7"/>
    <circle cx="47" cy="81" r="2" fill="#38bdf8"/>
    <line x1="56" y1="81" x2="82" y2="81" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>

    <!-- Side Mounting Brackets -->
    <line x1="20" y1="28" x2="24" y2="28" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="52" x2="24" y2="52" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="76" x2="24" y2="76" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="28" x2="100" y2="28" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="52" x2="100" y2="52" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="76" x2="100" y2="76" stroke="url(#grad-server)" stroke-width="3" stroke-linecap="round"/>
</svg>
